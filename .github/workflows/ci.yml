name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Una sola ejecución por rama: un push nuevo cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `build` va primero: el paquete NestJS consume los tipos de
      # sri-ec desde su dist/, así que typecheck y test lo necesitan.
      - run: npm run build

      - run: npm run typecheck

      - run: npm test
